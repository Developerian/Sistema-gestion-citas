<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Sistema de Citas</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e2f; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #252538; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        .login-card h2 { margin-bottom: 20px; text-align: center; color: #4f46e5; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #3f3f5f; background: #1e1e2f; color: #fff; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 12px; background: #4f46e5; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #4338ca; }
        .error-list { background: #ef4444; color: white; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; list-style: none; padding-left: 10px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Sistema de Citas</h2>
    
    {% if form.errors %}
        <ul class="error-list">
            <li>El usuario o la contraseña son incorrectos. Por favor, verifica.</li>
        </ul>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_username">Usuario:</label>
            <input type="text" name="username" id="id_username" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="id_password">Contraseña:</label>
            <input type="password" name="password" id="id_password" required>
        </div>

        <button type="submit" class="btn-submit">Ingresar al Sistema</button>
    </form>
</div>

</body>
</html>
