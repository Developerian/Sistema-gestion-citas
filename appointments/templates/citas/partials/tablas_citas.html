<table class="table-citas">

    <thead>

        <tr>
            <th>Cliente</th>
            <th>Servicio</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>

    </thead>


    <tbody>

        {% for cita in citas %}

        <tr>

            <td>{{ cita.id_cliente }}</td>

            <td>{{ cita.id_servicio }}</td>

            <td>{{ cita.fecha_cita }}</td>

            <td>{{ cita.hora_cita }}</td>

            <td>
                <span class="badge">
                    {{ cita.estado }}
                </span>
            </td>


            <td>
                
                <button class="btn-open-delete" data-url="{% url 'eliminar_cita' cita.id_cita %}"">
                    Eliminar
                </button>

            
                <button class="btn-open-update" data-id="{{cita.id_cita}}" data-cliente="{{cita.id_cliente}}">
                    Editar
                </button>
                
            </td>


        </tr>


        {% empty %}

        <tr>

            <td colspan="6" class="empty-msg">
                No existen citas registradas.
            </td>

        </tr>

        {% endfor %}


    </tbody>

</table>
