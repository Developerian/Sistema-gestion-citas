{% extends "dashboard/base_dashboard.html" %}
{% block title %}
Eliminar cita
{% endblock %}

{% block menu_citas %}
active
{% endblock %}

{% block encabezado %}
Eliminar cita
{% endblock %}



<h2>Eliminar cita </h2>

<p>
    ¿Desea eliminar la cita de
    <strong>{{cita.id_cliente}} </strong>?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">
        Si, eliminar
    </button>

    <a href="{% url 'lista_citas' %}">
        Cancelar
    </a>
</form>
