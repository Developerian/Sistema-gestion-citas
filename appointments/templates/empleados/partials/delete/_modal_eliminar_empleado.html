<div id="modal-eliminar-empleado" class="modal oculto">

    <div class="modal-content">

        <button
            type="button"
            data-cerrar-modal
            class="close-btn"
            aria-label="Cerrar">

            ×

        </button>


        <h2>Eliminar empleado</h2>


        <p>
            ¿Estás seguro de que deseas eliminar este empleado?
        </p>


        <p>
            Esta acción no se puede deshacer.
        </p>


        <form
            method="POST"
            action="">

            {% csrf_token %}


            <div class="actions-group">

                <button
                    type="button"
                    data-cerrar-modal
                    class="btn">

                    Cancelar

                </button>


                <button
                    type="submit"
                    class="btn-delete">

                    <i class="bi bi-trash"></i>
                    Eliminar empleado

                </button>

            </div>

        </form>

    </div>

</div>
