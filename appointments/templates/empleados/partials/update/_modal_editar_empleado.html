<div id="modal-editar-empleado" class="modal oculto">

    <div class="modal-content">

        <button
            type="button"
            data-cerrar-modal
            class="close-btn"
            aria-label="Cerrar">

            ×

        </button>


        <h2>Editar empleado</h2>


        <form
            method="POST"
            action="">

            {% csrf_token %}

            {% include "empleados/partials/update/_formulario_empleado.html" %}


            <button
                type="submit"
                class="btn-save">

                <i class="bi bi-check-circle"></i>
                Guardar cambios

            </button>

        </form>

    </div>

</div>
